name: Feature Request
description: Suggest a new feature or enhancement for LunoDB
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape LunoDB! Please search [existing issues](https://github.com/lunodb/lunodb/issues?q=label%3Aenhancement) first — if your idea is already there, add a 👍 instead of opening a new one.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe how you would use this feature in your workflow.
    validations:
      required: false

  - type: checkboxes
    id: databases
    attributes:
      label: Affected Databases
      description: Which database types would this feature apply to?
      options:
        - label: MySQL
        - label: PostgreSQL
        - label: SQLite
        - label: MariaDB
        - label: MongoDB
        - label: SQL Server
        - label: Redis
        - label: Turso
        - label: All databases

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) is this request for?
      multiple: true
      options:
        - All platforms
        - macOS
        - Windows
        - Linux
        - iOS
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
